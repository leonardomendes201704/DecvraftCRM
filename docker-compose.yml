services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: whitelabel-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - whitelabel-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: whitelabel-api
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=${MSSQL_DATABASE};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    ports:
      - "8080:8080"
    depends_on:
      - mssql
    networks:
      - whitelabel-network

  installer:
    build:
      context: .
      dockerfile: docker/Dockerfile.installer
    container_name: whitelabel-installer
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=${MSSQL_DATABASE};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    ports:
      - "8081:8080"
    depends_on:
      - mssql
    networks:
      - whitelabel-network

volumes:
  mssql_data:

networks:
  whitelabel-network:
    driver: bridge
